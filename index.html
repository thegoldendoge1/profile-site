  <div class="subtitle">noise / signal / void</div>

  <div class="links">
  <a href="https://t.me/thegoldendoge" target="_blank" rel="noopener noreferrer">Telegram</a>

<!-- Плашка Last.fm -->
  <div id="lastfm-widget" class="lastfm-widget">

      <div class="lastfm-info">

          <div id="lastfm-artist" class="lastfm-artist">Artist</div>
      </div>
  </div>

<!-- Плашка Minecraft сервера -->
  <div id="minecraft-widget" class="minecraft-widget">
      <img class="mc-icon" src="minecraft-icon.png" alt="Minecraft">
      <div class="mc-info">
          <div id="mc-status" class="mc-status">
              <span id="mc-status-dot" class="status-dot"></span>
              <span id="mc-status-text" class="mc-status-text">Checking...</span>
          </div>
          <div id="mc-title" class="mc-title">lenscape.space</div>

          <div id="mc-version" class="mc-version"></div>
      </div>
      <button id="mc-copy-btn" class="mc-copy-btn" title="Copy IP">

              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
